<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#20282a">
    <title>Whale Buffet | Register as player</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", sans-serif;
            color: #20282a;
            background: #f4f6f4;
            font-synthesis: none;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(145deg, #f4f6f4 0%, #e8eeec 100%);
        }

        header {
            padding: 22px max(24px, calc((100vw - 760px) / 2));
            color: #f7f8f5;
            background: #20282a;
            border-bottom: 4px solid #9d1515;
        }

        header p {
            margin: 0 0 4px;
            color: #a9c5c0;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: 28px;
            font-weight: 600;
        }

        main {
            width: min(100% - 32px, 680px);
            margin: 34px auto;
        }

        section {
            margin-bottom: 20px;
            padding: 22px;
            border: 1px solid #cbd4d1;
            border-radius: 6px;
            background: #fff;
            box-shadow: 0 8px 26px rgb(32 40 42 / 6%);
        }

        h2 {
            margin: 0 0 18px;
            font-size: 17px;
        }

        .field-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .player-name-zone {
            max-width: 420px;
            padding-bottom: 18px;
            border-bottom: 1px solid #cbd4d1;
            margin-bottom: 18px;
        }

        .role-preferences-zone {
            min-width: 0;
            padding: 0;
            border: 0;
            margin: 0;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #465553;
            font-size: 13px;
            font-weight: 650;
        }

        input, select {
            width: 100%;
            min-height: 42px;
            padding: 9px 11px;
            border: 1px solid #aebbb7;
            border-radius: 4px;
            background: #fff;
            color: #20282a;
            font: inherit;
        }

        input:focus, select:focus {
            border-color: #246b67;
            outline: 3px solid rgb(36 107 103 / 18%);
        }

        .join-row, .actions {
            display: flex;
            align-items: end;
            gap: 10px;
        }

        .join-row label { flex: 1; }

        button {
            min-height: 42px;
            padding: 0 16px;
            border: 0;
            border-radius: 4px;
            background: #9d1515;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover { background: #791010; }
        button:focus-visible { outline: 3px solid #246b67; outline-offset: 2px; }
        button:disabled { cursor: default; opacity: .6; }

        .status {
            min-height: 24px;
            margin: 16px 0 0;
            color: #465553;
            font-size: 14px;
        }

        .status[data-kind="error"] { color: #9d1515; }
        .status[data-kind="success"] { color: #176044; }

        [hidden] { display: none !important; }

        @media (max-width: 540px) {
            header { padding: 18px 20px; }
            h1 { font-size: 24px; }
            main { width: min(100% - 24px, 680px); margin: 20px auto; }
            section { padding: 18px; }
            .field-grid { grid-template-columns: 1fr; gap: 12px; }
            .join-row { align-items: stretch; flex-direction: column; }
        }
    </style>
</head>
<body>
    <header>
        <p>Whale Buffet Generator</p>
        <h1>Register as player</h1>
    </header>
    <main>
        <section aria-labelledby="connect-title">
            <h2 id="connect-title">Connect to a game</h2>
            <div class="join-row">
                <label for="room-code">Room code
                    <input id="room-code" name="room-code" autocomplete="off" autocapitalize="characters" required>
                </label>
                <button id="connect-button" type="button">Connect</button>
            </div>
            <p id="status" class="status" role="status" aria-live="polite">Enter the room code shared by your Storyteller.</p>
        </section>

        <section id="preferences-section" aria-labelledby="preferences-title" hidden>
            <h2 id="preferences-title">Role preferences</h2>
            <form id="preferences-form">
                <div class="player-name-zone">
                    <label for="player-name">Player name</label>
                    <input id="player-name" name="name" maxlength="80" autocomplete="name" required>
                </div>
                <fieldset class="role-preferences-zone">
                    <div class="field-grid">
                    <div>
                        <label for="townsfolk">Townsfolk</label>
                        <select id="townsfolk" name="townsfolk" required></select>
                    </div>
                    <div>
                        <label for="outsider">Outsider</label>
                        <select id="outsider" name="outsider" required></select>
                    </div>
                    <div>
                        <label for="minion">Minion</label>
                        <select id="minion" name="minion" required></select>
                    </div>
                    <div>
                        <label for="demon">Demon</label>
                        <select id="demon" name="demon" required></select>
                    </div>
                    </div>
                </fieldset>
                <div class="actions" style="margin-top: 18px">
                    <button id="submit-button" type="submit">Send preferences</button>
                    <button id="character-button" type="button" hidden>Check my character</button>
                </div>
            </form>
        </section>
    </main>

    <script>
        const roomCodeInput = document.querySelector("#room-code");
        const connectButton = document.querySelector("#connect-button");
        const preferencesSection = document.querySelector("#preferences-section");
        const preferencesForm = document.querySelector("#preferences-form");
        const submitButton = document.querySelector("#submit-button");
        const characterButton = document.querySelector("#character-button");
        const status = document.querySelector("#status");
        let connectedRoomCode = "";
        let playerToken = "";

        function setStatus(message, kind = "") {
            status.textContent = message;
            status.dataset.kind = kind;
        }

        async function readResponse(response) {
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || "The request could not be completed.");
            }
            return data;
        }

        connectButton.addEventListener("click", async () => {
            if (connectedRoomCode) {
                connectedRoomCode = "";
                roomCodeInput.readOnly = false;
                roomCodeInput.value = "";
                preferencesSection.hidden = true;
                connectButton.textContent = "Connect";
                submitButton.textContent = "Send preferences";
                submitButton.disabled = false;
                characterButton.hidden = true;
                playerToken = "";
                setStatus("Enter the room code shared by your Storyteller.");
                return;
            }

            const roomCode = roomCodeInput.value.trim().toUpperCase();
            if (!roomCode) {
                roomCodeInput.focus();
                setStatus("Enter a room code first.", "error");
                return;
            }

            connectButton.disabled = true;
            setStatus("Connecting...");
            try {
                const headers = { "X-Room-Code": roomCode };
                await readResponse(await fetch("/session", { headers }));
                const data = await readResponse(await fetch("/roles", { headers }));
                for (const roleType of ["townsfolk", "outsider", "minion", "demon"]) {
                    const select = document.querySelector(`#${roleType}`);
                    select.replaceChildren(new Option("Choose a role", ""));
                    for (const roleName of data.roles[roleType] || []) {
                        select.add(new Option(roleName, roleName));
                    }
                }
                connectedRoomCode = roomCode;
                roomCodeInput.readOnly = true;
                connectButton.textContent = "Change room";
                preferencesSection.hidden = false;
                setStatus("Connected. Choose one preference for each role type.", "success");
            } catch (error) {
                setStatus(error.message, "error");
            } finally {
                connectButton.disabled = false;
            }
        });

        preferencesForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            submitButton.disabled = true;
            setStatus("Sending preferences...");
            const formData = new FormData(preferencesForm);
            const player = Object.fromEntries(formData.entries());
            try {
                const response = await fetch("/player", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Room-Code": connectedRoomCode,
                    },
                    body: JSON.stringify(player),
                });
                const data = await readResponse(response);
                if (data.player_token) {
                    playerToken = data.player_token;
                    characterButton.hidden = false;
                }
                submitButton.textContent = "Send again";
                setStatus(data.message, "success");
            } catch (error) {
                setStatus(error.message, "error");
            } finally {
                submitButton.disabled = false;
            }
        });

        characterButton.addEventListener("click", async () => {
            if (!playerToken) {
                setStatus("Submit your preferences before checking your character.", "error");
                return;
            }
            characterButton.disabled = true;
            setStatus("Checking your character...");
            try {
                const data = await readResponse(await fetch("/character", {
                    headers: {
                        "X-Room-Code": connectedRoomCode,
                        "X-Player-Token": playerToken,
                    },
                }));
                const alignment = data.evil ? " (Evil)" : "";
                setStatus(`Your character is ${data.character}${alignment}.`, "success");
            } catch (error) {
                setStatus(error.message, "error");
            } finally {
                characterButton.disabled = false;
            }
        });
    </script>
</body>
</html>
